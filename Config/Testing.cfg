// Test configuration

// Cheats and player settings
sv_cheats "1" // Enable Cheats on server
sv_infinite_ammo "1" // Enable infinite ammo
sv_regeneration_force_on "1" // Force health regeneration
mp_free_armor "2" // Enable free armor for everyone
mp_humanteam "any" // Allow human players to join any team

// Player view toggle
alias pov_firstperson "firstperson; alias pov pov_thirdperson"
alias pov_thirdperson "thirdperson; alias pov pov_firstperson"
alias pov "pov_thirdperson"
b/ind "k" "pov"

// Bots
bot_kick // Kick all bots
bot_stop "1" // Stop all bots

// Round and warmup settings
mp_warmup_end // End warmup
mp_round_restart_delay "0" // Set delay before restarting a round
mp_autoteambalance "0" // Disable auto team balance
mp_limitteams "0" // Disable team limit
mp_freezetime "0" // Disable freeze time
mp_roundtime 60 // Set normal round time
mp_roundtime_defuse "60" // Set defuse round time
mp_roundtime_hostage "60" // Set hostage round time
mp_restartgame "1" // Restart game

// Economy and buying
mp_maxmoney "99999" // Set maximum money
mp_startmoney "99999" // Set starting money
mp_buy_anywhere "1" // Allow buying anywhere on the map
mp_buytime "1000000000" // Set buy time to a very large value

// Respawn settings
mp_respawn_on_death_ct "1" // Respawn on death for Counter-Terrorists
mp_respawn_on_death_t "1" // Respawn on death for Terrorists

// Bindings
bind "n" noclip // Bind noclip

// Console
clear // Clear console

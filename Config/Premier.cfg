// Counter-Strike 2 configuration
// Load with: +exec Cfg_organized.cfg

// Reset existing binds before applying this configuration
unbindall

// Display and HUD
r_fullscreen_gamma "2.2" // Screen brightness
hud_scaling "0.9" // HUD size
cl_hud_color "11" // HUD color
cl_allow_animated_avatars "0" // Disable animated avatars
cl_showloadout "1" // Always show equipment
cl_radar_square_with_scoreboard "1" // Square radar on scoreboard
r_show_build_info "0" // Hide build information
safezonex "1"
safezoney "0.9"

// Radar
cl_hud_radar_scale "1" // Radar size relative to HUD
cl_radar_scale "0.4" // Radar zoom
cl_radar_always_centered "1" // Keep player centered
cl_radar_rotate "1" // Rotate radar with player

// Team information
+cl_show_team_equipment
cl_teamid_overhead_mode "3" // Equipment and info above teammates
cl_teamid_overhead_colors_show "0" // Hide teammate overhead colors
cl_teammate_colors_show "2" // Teammate colors on radar

// Crosshair
cl_crosshairstyle 4
cl_crosshaircolor_r 255
cl_crosshaircolor_g 255
cl_crosshaircolor_b 255
cl_crosshaircolor_a 255
cl_crosshair_drawoutline 2
cl_crosshairoutline_r 0
cl_crosshairoutline_g 0
cl_crosshairoutline_b 0
cl_crosshairoutline_a 255
cl_crosshair_thickness 1
cl_crosshairdot 0
cl_crosshair_gap 4
cl_crosshair_length 6
cl_crosshair_t 0
cl_crosshair_dynamic_spread_limit 255
cl_crosshair_dynamic_splitdist 7
cl_crosshair_dynamic_splitalpha_innermod 1
cl_crosshair_dynamic_splitalpha_outermod 0.5
cl_crosshair_dynamic_maxdist_splitratio 0.3
cl_ironsight_usecrosshaircolor 0
cl_ironsight_dot_scale 1
cl_crosshair_recoil 0
cl_crosshair_screen_height 1080

// Audio
snd_mixahead "0.025" // Audio buffer
snd_headphone_eq "1" // Headphone equalization
snd_spatialize_lerp "0" // L/R perspective
snd_steamaudio_enable_perspective_correction "1" // Perspective correction
snd_mute_mvp_music_live_players "0" // MVP music while players are alive
snd_menumusic_volume "0" // Menu music volume
snd_roundstart_volume "0" // Round start music volume
snd_roundend_volume "0" // Round end music volume
snd_roundaction_volume "0" // Round action music volume
snd_mvp_volume "0.090000" // MVP volume
snd_deathcamera_volume "0" // Death camera volume
snd_voipvolume "1" // Voice chat volume
snd_tensecondwarning_volume "0.092884" // Ten-second bomb warning volume

// Viewmodel
viewmodel_fov 68
viewmodel_offset_x 2.5
viewmodel_offset_y -2
viewmodel_offset_z -2
viewmodel_presetpos 1

// Mouse and scope
zoom_sensitivity_ratio "1.0" // Scoped sensitivity
cl_sniper_delay_unscope "0" // Disable unscope delay
cl_sniper_auto_rezoom "1" // Re-zoom after shot

// Gameplay and interface
con_enable "true" // Enable console
engine_low_latency_sleep_after_client_tick "1" // Frame timing option
r_player_visibility_mode "0" // Player contrast mode
cl_use_opens_buy_menu "0" // E does not open buy menu
cl_dm_buyrandomweapons "0" // Disable random weapons in Deathmatch
cl_scoreboard_mouse_enable_binding "+attack2" // Mouse2 on scoreboard
cl_silencer_mode "0" // Silencer behavior
spec_show_xray "1" // X-ray in spectator mode
joystick "0" // Disable joystick
net_client_steamdatagram_enable_override "1" // Steam Datagram override

// Automatic purchase (F3)
cl_autobuy vesthelm vest m4a1 m4a1_silencer ak47 famas galilar mp9 xm1014 defuser

// Key bindings
// Weapons and equipment
bind "1" "slot1" // Primary weapon
bind "2" "slot2" // Secondary weapon
bind "3" "slot3" // Knife
bind "4" "slot4" // Grenades
bind "5" "slot5" // C4
bind "6" "slot6" // Defuse kit
bind "9" "slot9" // Slot 9
bind "x" "slot12" // Slot 12

// Movement
bind "w" "+forward"
bind "s" "+back"
bind "a" "+left"
bind "d" "+right"
bind "SHIFT" "+sprint"
bind "CTRL" "+duck"
bind "SPACE" "+jump"
bind "mwheelup" "+jump" // Jump with mouse wheel
bind "mwheeldown" "+jump" // Jump with mouse wheel

// Actions and communication
bind "e" "+use"
bind "b" "buymenu"
bind "q" "drop"
bind "r" "+reload"
bind "h" "+radialradio2"
bind "m" "teammenu"
bind "n" "noclip" // Toggle noclip movement
bind "t" "+spray_menu"
bind "u" "messagemode2" // Team chat
bind "y" "messagemode" // All chat
bind "z" "radio"
bind "v" "+lookatweapon"
bind "alt" "switchhands"
bind "mouse3" "player_ping"
bind "mouse5" "+voicerecord" // Push to talk

// Combat and utility
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "MOUSE_X" "yaw" // Horizontal mouse movement
bind "MOUSE_Y" "pitch" // Vertical mouse movement
bind "F3" "autobuy" // Buy configured loadout
bind "F4" "rebuy" // Rebuy last loadout
bind "F8" "disconnect" // Disconnect from server

// Menus and console
bind "TAB" "+showscores"
bind "ESCAPE" "cancelselect"
bind "`" "toggleconsole"

// Apply and confirm configuration
host_writeconfig
clear
echo "Souza's loaded"
